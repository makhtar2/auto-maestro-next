<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D61E7" />
      <stop offset="100%" stop-color="#1143AC" />
    </linearGradient>
  </defs>

  <!-- Modern Automotive Shield Badge -->
  <g transform="translate(4, 3)">
    <!-- Outer Shield Frame -->
    <path d="M22,4 L40,11 V25 C40,34.5 28.5,41.5 22,44 C15.5,41.5 4,34.5 4,25 V11 L22,4 Z" 
          fill="url(#logoBlueGrad)" />
    
    <!-- Inner Sleek Aerodynamic Car Silhouette -->
    <path d="M12,24 C14,20 18,19 22,17 C26,17 29,20 32,24 L34,26 H10 L12,24 Z" 
          fill="#FFFFFF" />
    
    <!-- Accent Speed Line -->
    <path d="M9,28 H35 L33,30 H11 L9,28 Z" 
          fill="#FFFFFF" opacity="0.85" />
          
    <circle cx="15" cy="30" r="2" fill="#FFFFFF" />
    <circle cx="29" cy="30" r="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="56" y="27" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="22" 
        font-weight="800" 
        fill="#0F172A" 
        letter-spacing="-0.5">AUTO</text>

  <text x="122" y="27" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="22" 
        font-weight="800" 
        fill="#1D61E7" 
        letter-spacing="-0.5">MAESTRO</text>

  <!-- Subtitle Tagline -->
  <text x="57" y="42" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        fill="#64748B" 
        letter-spacing="3">AUTOMOBILE LLC</text>
</svg>
